# ============================================================
# YAML ANCHORS
# ============================================================

x-superset-volumes:
  &superset-volumes
  - ./docker:/app/docker
  - superset_home:/app/superset_home

x-common-build:
  &common-build
  context: .
  target: ${BUILD_TARGET:-dev}
  cache_from:
    - apache/superset-cache:3.10-slim-trixie
  args:
    BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-true}
    SUPERSET_VERSION: ${SUPERSET_VERSION:-6.0.1}

x-superset-service:
  &superset-service
  build: *common-build
  image: ghcr.io/datacardio/superset:${IMAGE_TAG:-latest}
  user: "root"
  env_file:
    - path: docker/.env
      required: true
    - path: docker/.env-local
      required: false
  volumes: *superset-volumes

# ============================================================
# SERVICES
# ============================================================

services:
  # === StatsD + Graphite ===
  graphite:
    image: graphiteapp/graphite-statsd:latest
    container_name: graphite
    ports:
      - "8080:80"
    volumes:
      - graphite_data:/opt/graphite/storage
      - graphite_conf:/opt/graphite/conf
      - graphite_logs:/var/log
    restart: unless-stopped

  # === Grafana ===
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - graphite

  # === Superset infrastructure ===
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - redis:/data

  db:
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  # === Superset services (локальная сборка) ===
  superset:
    <<: *superset-service
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    ports:
      - "800:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully

  superset-init:
    <<: *superset-service
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      disable: true

  superset-worker:
    <<: *superset-service
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]

  superset-worker-beat:
    <<: *superset-service
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    healthcheck:
      disable: true



# ============================================================
# VOLUMES
# ============================================================

volumes:
  graphite_data:
  graphite_conf:
  graphite_logs:
  grafana_data:
  superset_home:
  db_home:
  redis:
